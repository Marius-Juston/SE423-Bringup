name: Accessibility

# The accessibility suite (tools/a11y, docs/ACCESSIBILITY.md).
# Pull requests run the subset (--quick) and fail on a finding that is not in
# a11y-baseline.json. Pushes to main run the same subset and only report, so
# publishing is never blocked. The whole sweep runs once a week and on a manual
# run, reporting only: on a hosted 4-core runner it takes about 100 minutes
# (33 minutes on 4 cores of a development machine, and the runner is about three
# times slower), too long and too close to a time limit for every push.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-24.04
    # The subset takes about 25 minutes here, the whole sweep about 100.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 240 || 60 }}
    permissions:
      contents: read
      security-events: write # the findings as code-scanning alerts (SARIF)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Accessibility suite, pull request subset (gating)
        if: github.event_name == 'pull_request'
        run: npm run a11y -- --quick --workers 4
      - name: Accessibility suite, subset on main (reporting only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: npm run a11y -- --quick --workers 4
      - name: Accessibility suite, whole sweep (weekly and manual, reporting only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run a11y -- --workers 4
      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-findings
          path: |
            a11y-out/findings.json
            a11y-out/findings.sarif
            a11y-out/summary.md
          if-no-files-found: ignore
      # Code scanning needs a token that may write security events: a pull request from a fork has none.
      - name: Upload the findings to code scanning
        if: always() && hashFiles('a11y-out/findings.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: a11y-out/findings.sarif
          category: accessibility
